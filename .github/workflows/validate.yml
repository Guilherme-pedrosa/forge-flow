name: Validate ERP
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:operations
      - run: npm run test:database
      - run: node scripts/test-bambu-execution-learning.mjs
      - run: npm run test:assembly
      - run: npm run test:lorace
      - run: npm run test:slicer
      - run: npm run build:worker
      - run: npm run build
